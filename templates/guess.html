{% extends 'layout.html' %}

{% block title %} Guess the Movie {% endblock %}

{% block content %}
<div class="form-background">
    <div class="forms mb-4">
        <h2>Guess the movie by its poster:</h2>
        <form class="form-inline" method="post">
            <input type="hidden" name="movie_id" value="{{ randomPoster['movie_id'] }}">
            <input type="hidden" name="movie_title" id="movie_title" value="{{ randomPoster['title'] }}">

            <label for="movie"> Try to guess the movie: </label>
            <div class="autocomplete-wrapper" style="position:relative;">
                <input type="search" class="form-control" name="movie" placeholder="Title" list="movie-list" id="movie"
                    autocomplete="off" value="{{ request.form.get('movie', '') }}">
                <div id="movie-list" class="autocomplete-list">
                    {% for m in movies %}
                    <div class="autocomplete-option" data-value="{{ m[2] }}" style="padding:5px; cursor:pointer;">
                        {{ m[2] }}
                    </div>
                    {% endfor %}
                </div>
            </div>
            <button class="btn btn-primary" id="guess-button" type="submit">Guess</button>
        </form>


        <div class="card">
            <div class="row g-0">
                <div class="col">
                    <img src="{{ randomPoster['poster_url'] }}" class="img-fluid poster-img" id="poster"
                        alt="Random Movie">
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-sm mt-2">
                <span class="stat-shower">Score: {{ session['score'] }} </span>
            </div>
            <div class="col-sm mt-2">
                <span class="stat-shower">Guesses: {{ session['guesses'] }} </span>
            </div>
            <div class="col-sm mt-2">
                <span class="stat-shower">Max Score: {{ session['maxScore'] }} </span>
            </div>

        </div>
    </div>

</div>

<script>
    const poster = document.getElementById('poster');
    const movieTitle = document.getElementById('movie_title').value;
    const movieGuess = document.getElementById('movie').value;
    const guesses = {{ session['guesses'] }};
    const score = {{ session['score'] }};
    let clicks = guesses;
    function GuessMovie() {
        if (movieTitle.localeCompare(movieGuess) == 0) {
            console.log("Correct!")
        }
        else {
            //event.preventDefault();
            revealPoster(clicks);
        }
    }

    function revealPoster(clicks) {
        //console.log(clicks);
        const poster = document.getElementById('poster');
        if (clicks === 1) {
            poster.style.filter = 'blur(6px)';

        } else if (clicks === 2) {
            poster.style.filter = 'blur(4px)';

        } else if (clicks === 3) {
            poster.style.filter = 'blur(3px)';

        } else if (clicks === 4) {
            poster.style.filter = 'blur(2px)';

        } else if (clicks > 4) {
            poster.style.filter = 'blur(1px)';

        }
    }

    GuessMovie()

    console.log(movieTitle);
    console.log(movieGuess);
    console.log(movieTitle.localeCompare(movieGuess));
</script>

<script>

    const input = document.getElementById("movie");
    const movieList = document.getElementById("movie-list");
    const options = movieList.querySelectorAll(".autocomplete-option");
    let currentFocus = -1;

    input.onfocus = function () {
        movieList.style.display = "block";
    };

    document.addEventListener("click", function (e) {
        if (e.target !== input) {
            movieList.style.display = "none";
        }
    });

    options.forEach(option => {
        option.addEventListener("click", function () {
            input.value = this.dataset.value;
            movieList.style.display = "none";
        });
    });

    input.oninput = function () {
        const text = input.value.toUpperCase();
        options.forEach(option => {
            option.style.display = option.dataset.value.toUpperCase().includes(text) ? "block" : "none";
        });
        currentFocus = -1;
    };

    input.onkeydown = function (e) {
        const visibleOptions = Array.from(options).filter(o => o.style.display !== "none");
        if (e.keyCode == 40) { // down
            currentFocus++;
            addActive(visibleOptions);
        } else if (e.keyCode == 38) { // up
            currentFocus--;
            addActive(visibleOptions);
        } else if (e.keyCode == 13) { // enter
            e.preventDefault();
            if (currentFocus > -1 && visibleOptions[currentFocus]) {
                visibleOptions[currentFocus].click();
            }
        }
    };

    function addActive(visibleOptions) {
        removeActive();
        if (currentFocus >= visibleOptions.length) currentFocus = 0;
        if (currentFocus < 0) currentFocus = visibleOptions.length - 1;
        visibleOptions[currentFocus].classList.add("active");
    }

    function removeActive() {
        options.forEach(o => o.classList.remove("active"));
    }

</script>

{% endblock %}
