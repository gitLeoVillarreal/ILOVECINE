<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Miranda+Sans:ital,wght@0,400..700;1,400..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Stack+Sans+Text:wght@200..700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">

    <link href="static/styles.css" rel="stylesheet">
    <link href="static/icon.png" rel="icon">

    <title>{% block title%}{% endblock %}</title>
</head>

<body>
    <div class="layout">
        <div class="sidebar-background">
            <nav class="navbar sidebar">

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#Menu">
                    <i class="bi bi-list"></i>
                </button>

                <div class="collapse collapse-horizontal nav-collapse" id="Menu">
                    <div class="sidebarhead pt-3 ps-4">
                        <h3> <span class="material-symbols-outlined">Movie</span> Movies </h3>
                    </div>
                    <hr class="ms-3">

                    <ul class="navbar-nav">
                        <li class="nav-item ms-2"><a class="nav-link" href="/Recomendations"><i
                                    class="bi bi-camera-reels me-2"></i>Recomend a movie</a></li>
                        <li class="nav-item ms-2"><a class="nav-link" href="/GuessTheMovie"><i
                                    class="bi bi-joystick me-2"></i>Guess the movie</a></li>

                        <li class="nav-item ms-2 mt-4"><a class="nav-link" href="/Settings"><i
                                    class="bi bi-gear me-2"></i>Settings</a></li>
                    </ul>
                </div>
            </nav>
        </div>
        <main class="content">
            {% block content %}
            {% endblock %}
        </main>
    </div>

</body>


</html>
